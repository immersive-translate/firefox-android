// Prevents gradle builds from looking for a root settings.gradle
pluginManagement {
    if (!gradle.root.hasProperty("mozconfig")){
        apply from: file('../../../gradle/mozconfig.gradle')
    } else {
        gradle.ext.mozconfig = gradle.root.mozconfig
    }

    repositories {
        gradle.mozconfig.substs.GRADLE_MAVEN_REPOSITORIES.each { repository ->
            maven {
                url = repository
                if (gradle.mozconfig.substs.ALLOW_INSECURE_GRADLE_REPOSITORIES) {
                    allowInsecureProtocol = true
                }
            }
        }
    }
}

dependencyResolutionManagement {
    def libsCatalog = [
            file("../../../../../gradle/libs.versions.toml"),
            file("../../../gradle/libs.versions.toml"),
    ].find { it.exists() }
    if (libsCatalog == null) {
        throw new GradleException("Could not find gradle/libs.versions.toml for config plugin settings.")
    }
    versionCatalogs {
        libs {
            from(files(libsCatalog))
        }
    }
}
